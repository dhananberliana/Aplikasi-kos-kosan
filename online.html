async function loadDashboard(){const req=++dashboardReq,pid=property;$('dashboard').textContent='Memuat dashboard...';if(!pid){$('dashboard').innerHTML='<section>Belum ada properti. <button id="firstProperty">Tambah properti</button></section>';$('firstProperty').onclick=()=>{dashboardMode=false;tab='properties';render();openForm()};return}try{const [a,b]=await Promise.all([allRows('invoices',pid),allRows('payments',pid)]);if(req!==dashboardReq||!dashboardMode)return;dashInvoices=a;dashPayments=b;drawDashboard()}catch(e){if(req===dashboardReq)$('dashboard').textContent='Gagal memuat dashboard: '+e.message}}
function monthLabel(m){return new Date(m+'-15T12:00:00Z').toLocaleDateString('id-ID',{month:'short',year:'numeric',timeZone:'Asia/Makassar'})}
function paymentMonth(p){const d=new Date(p.paid_at);return Number.isNaN(d.valueOf())?'':d.toLocaleDateString('sv-SE',{timeZone:'Asia/Makassar'}).slice(0,7)}
function drawDashboard(){const m=selectedMonth, invoices=dashInvoices.filter(i=>i.period_start.slice(0,7)===m), pay=i=>dashPayments.filter(p=>p.invoice_id===i.id).reduce((n,p)=>n+Number(p.amount),0), total=invoices.reduce((n,i)=>n+Number(i.total),0), settled=invoices.reduce((n,i)=>n+Math.min(Number(i.total),pay(i)),0), remaining=Math.max(0,total-settled), late=invoices.filter(i=>i.due_date<today()).reduce((n,i)=>n+Math.max(0,Number(i.total)-pay(i)),0), received=dashPayments.filter(p=>paymentMonth(p)===m).reduce((n,p)=>n+Number(p.amount),0), rs=records.rooms.filter(r=>r.property_id===property), occupied=rs.filter(r=>records.contracts.some(c=>c.active&&c.room_id===r.id)).length, maintenance=rs.filter(r=>r.maintenance&&!records.contracts.some(c=>c.active&&c.room_id===r.id)).length, occupancy=rs.length?Math.round(occupied/rs.length*100):0,pct=total?Math.round(settled/total*100):0;
const months=Array.from({length:6},(_,i)=>{let d=new Date(m+'-15T12:00:00Z');d.setUTCMonth(d.getUTCMonth()-5+i);return d.toISOString().slice(0,7)}), vals=months.map(x=>dashPayments.filter(p=>paymentMonth(p)===x).reduce((n,p)=>n+Number(p.amount),0)), max=Math.max(1,...vals);
const card=(label,value)=>'<article class="metric"><small>'+label+'</small><h2>'+value+'</h2></article>';
$('dashboard').innerHTML='<div class="topline"><label>Periode laporan<input class="period" id="dashMonth" type="month" value="'+esc(m)+'"></label><button id="dashRefresh" class="secondary">Refresh data</button></div><article class="metric hero" style="margin-top:14px"><small>Pembayaran diterima pada bulan '+esc(monthLabel(m))+'</small><h2>'+rupiah(received)+'</h2><p>Arus kas masuk berdasarkan tanggal pembayaran, bukan tanggal tagihan.</p></article><div class="dashboard-grid">'+card('Total tagihan periode',rupiah(total))+card('Sisa tagihan periode',rupiah(remaining))+card('Terlambat periode',rupiah(late))+card('Kamar terisi saat ini',occupied+' / '+rs.length)+'</div><div class="chart-grid"><section><h3>Pendapatan 6 bulan</h3><small class="muted">Pembayaran berdasarkan tanggal transaksi</small><div class="chart-bars">'+vals.map((v,i)=>'<div class="chart-col"><b>'+esc(rupiah(v))+'</b><i style="height:'+Math.round(v/max*75)+'%"></i><small>'+esc(monthLabel(months[i]))+'</small></div>').join('')+'</div></section><section><h3>Okupansi kamar</h3><div class="donut" style="background:conic-gradient(#398565 '+occupancy+'%,#e0e9e1 0)"><div>'+occupancy+'%</div></div><p>'+occupied+' terisi · '+(rs.length-occupied-maintenance)+' kosong · '+maintenance+' maintenance</p></section></div><section><h3>Realisasi pembayaran tagihan periode</h3><p>'+rupiah(settled)+' dari '+rupiah(total)+' ('+pct+'%)</p><div class="track"><span style="width:'+pct+'%"></span></div></section><section><div class="topline"><h3>Tagihan penghuni · '+esc(monthLabel(m))+'</h3><button id="toBilling">Lihat tagihan</button></div>'+invoices.map(i=>{const c=records.contracts.find(x=>x.id===i.contract_id),t=records.tenants.find(x=>x.id===c?.tenant_id),r=records.rooms.find(x=>x.id===c?.room_id),p=pay(i),st=p>=Number(i.total)?'Lunas':i.due_date<today()?'Telat':p>0?'Dicicil':'Belum bayar';return '<div class="bill-row"><div><b>'+esc(t?.name||'Penghuni')+'</b><br><small class="muted">Kamar '+esc(r?.number||'-')+' · '+esc(i.due_date)+'</small></div><span class="tag '+(st==='Belum bayar'?'unpaid':st)+'">'+st+'</span><b>'+rupiah(Math.max(0,Number(i.total)-p))+'</b></div>'}).join('')+(!invoices.length?'<p class="muted">Belum ada tagihan periode ini.</p>':'')+'</section>';
$('dashMonth').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){selectedMonth=e.target.value;drawDashboard()}};$('dashRefresh').onclick=load;$('toBilling').onclick=()=>{dashboardMode=false;billingMode=true;render()};}


$('financeTab').onclick=()=>{financeMode=true;dashboardMode=false;billingMode=false;render()};
let financeReq=0, financeMonth=selectedMonth, financeExpenses=[],financePayments=[];
const categories=['Listrik','Air','Internet','Maintenance','Kebersihan','Pajak','Lain-lain'];
const dateMonth=x=>{const d=new Date(x);return Number.isNaN(d.valueOf())?'':d.toLocaleDateString('sv-SE',{timeZone:'Asia/Makassar'}).slice(0,7)};
const dateLocal=x=>new Date(x).toLocaleDateString('sv-SE',{timeZone:'Asia/Makassar'});
async function loadFinance(){const req=++financeReq,pid=property;$('finance').textContent='Memuat laporan keuangan...';if(!pid){$('finance').textContent='Buat properti terlebih dahulu.';return}try{const [a,b]=await Promise.all([allRows('expenses',pid),allRows('payments',pid)]);if(req!==financeReq||!financeMode)return;financeExpenses=a;financePayments=b;drawFinance()}catch(e){if(req===financeReq)$('finance').textContent='Gagal memuat laporan: '+e.message}}
function monthFinance(){return {expenses:financeExpenses.filter(e=>dateMonth(e.spent_at)===financeMonth),payments:financePayments.filter(p=>dateMonth(p.paid_at)===financeMonth)}}
function drawFinance(){const {expenses,payments}=monthFinance(),inc=payments.reduce((n,p)=>n+Number(p.amount),0),out=expenses.reduce((n,e)=>n+Number(e.amount),0),net=inc-out;const card=(l,v)=>'<article class="metric"><small>'+l+'</small><h2>'+rupiah(v)+'</h2></article>';$('finance').innerHTML='<div class="topline"><label>Periode<input type="month" class="period" id="financeMonth" value="'+esc(financeMonth)+'"></label><div class="tools"><button id="newExpense">+ Pengeluaran</button><button id="csvFinance" class="secondary">Export CSV</button><button id="refreshFinance" class="secondary">Refresh</button></div></div><div class="dashboard-grid" style="margin-top:14px">'+card('Pemasukan',inc)+card('Pengeluaran',out)+card('Kas bersih',net)+'</div><section><h3>Ringkasan pengeluaran</h3>'+categories.map(c=>{let v=expenses.filter(e=>e.category===c).reduce((n,e)=>n+Number(e.amount),0);return '<p>'+esc(c)+' · '+rupiah(v)+'</p><div class="track"><span style="width:'+(out?v/out*100:0)+'%"></span></div>'}).join('')+'</section><section><h3>Daftar pengeluaran</h3>'+expenses.sort((a,b)=>b.spent_at.localeCompare(a.spent_at)).map(e=>'<div class="bill-row"><div><b>'+esc(e.title)+'</b><br><small>'+esc(e.category||'-')+' · '+esc(dateLocal(e.spent_at))+'</small></div><b>'+rupiah(e.amount)+'</b><button class="secondary" data-expense-edit="'+esc(e.id)+'">Edit</button><button class="danger" data-expense-delete="'+esc(e.id)+'">Hapus</button></div>').join('')+(!expenses.length?'<p>Belum ada pengeluaran.</p>':'')+'</section><p class="notice">Laporan berbasis kas; bukan laba rugi akrual. Deposit dan penyusutan belum dihitung.</p>';$('financeMonth').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){financeMonth=e.target.value;drawFinance()}};$('newExpense').onclick=()=>editExpense();$('refreshFinance').onclick=loadFinance;$('csvFinance').onclick=exportFinance}
function editExpense(r){$('formTitle').textContent=r?'Edit pengeluaran':'Tambah pengeluaran';$('form').innerHTML='<label>Nama pengeluaran<input name="title" required value="'+esc(r?.title||'')+'"></label><label>Kategori<select name="category">'+categories.map(c=>'<option '+(r?.category===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label><label>Nominal (Rp)<input name="amount" type="number" min="1" step="1" required value="'+esc(r?.amount||'')+'"></label><label>Tanggal pengeluaran<input name="date" type="date" required value="'+esc(r?dateLocal(r.spent_at):today())+'"></label><button>Simpan online</button><button type="button" id="cancelExpense" class="secondary">Batal</button>';$('dialog').showModal();$('cancelExpense').onclick=()=>$('dialog').close();$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const f=Object.fromEntries(new FormData(e.target));if(!f.title.trim())return;const d={title:f.title.trim(),category:f.category,amount:Number(f.amount),spent_at:f.date+'T12:00:00+08:00'};await write(()=>r?db.from('expenses').update(d).eq('id',r.id).eq('owner_id',user.id).select('id').single():db.from('expenses').insert({...d,owner_id:user.id,property_id:property}).select('id').single(),true)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy||!financeMode)return;if(b.dataset.expenseEdit)editExpense(financeExpenses.find(x=>x.id===b.dataset.expenseEdit));if(b.dataset.expenseDelete&&confirm('Hapus pengeluaran ini?'))await write(()=>db.from('expenses').delete().eq('id',b.dataset.expenseDelete).eq('owner_id',user.id).select('id').single())});
function exportFinance(){const {expenses,payments}=monthFinance();const lines=[['Tanggal','Jenis','Keterangan','Kategori','Masuk (Rp)','Keluar (Rp)'],...payments.map(p=>[dateLocal(p.paid_at),'Pemasukan',p.invoice_id,p.method||'',p.amount,0]),...expenses.map(e=>[dateLocal(e.spent_at),'Pengeluaran',e.title,e.category||'',0,e.amount])];lines.push(['','TOTAL','','',payments.reduce((n,p)=>n+Number(p.amount),0),expenses.reduce((n,e)=>n+Number(e.amount),0)]);const cell=v=>{let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s)&&typeof v!=='number')s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const blob=new Blob(['\uFEFF'+lines.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Kostora-keuangan-'+financeMonth+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function printInvoice(i,c,t,r){const p=records.properties.find(x=>x.id===i.property_id),paid=paidFor(i),w=window.open('','_blank');if(!w){alert('Izinkan popup untuk mencetak nota.');return}w.opener=null;w.document.write('<!doctype html><html lang="id"><title>Nota Kostora</title><style>body{font:15px system-ui;max-width:650px;margin:40px auto;color:#173d34;padding:20px}h1{font-size:36px}hr{border:0;border-top:1px solid #ccc}table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #ddd}button{padding:10px}@media print{button{display:none}}</style><h1>kostora.</h1><h2>'+ (paid>=Number(i.total)?'Kuitansi lunas':'Nota tagihan')+'</h2><p>'+esc(invoiceNo(i))+'</p><hr><p>'+esc(p?.name)+'<br>'+esc(p?.address)+'</p><p>Penghuni: '+esc(t?.name)+'<br>Kamar: '+esc(r?.number)+'<br>Periode: '+esc(i.period_start)+'<br>Jatuh tempo: '+esc(i.due_date)+'</p><table><tr><td>Total</td><td>'+rupiah(i.total)+'</td></tr><tr><td>Dibayar</td><td>'+rupiah(paid)+'</td></tr><tr><td>Sisa</td><td>'+rupiah(Number(i.total)-paid)+'</td></tr><tr><td>Status</td><td>'+statusFor(i)+'</td></tr></table><h3>Riwayat pembayaran</h3>'+paymentRows.filter(x=>x.invoice_id===i.id).map(x=>'<p>'+esc(dateLocal(x.paid_at))+' · '+rupiah(x.amount)+' · '+esc(x.method)+'</p>').join('')+'<hr><p>Dokumen dihasilkan dari catatan pembayaran Kostora.</p><button onclick="window.print()">Cetak / Simpan PDF</button></html>');w.document.close()}

(async()=>{try{if(!db)throw Error('Library gagal dimuat');const {data,error}=await db.auth.getUser();if(error||!data.user){location.replace('./');return}user=data.user;db.auth.onAuthStateChange((event,session)=>{if(!session||session.user.id!==user.id){$('workspace').hidden=true;$('list').innerHTML='';if($('dialog').open)$('dialog').close();location.replace('./')}});await load()}catch(e){msg(e.message)}})();
