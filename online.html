<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kostora | Database Online</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f3;font:15px system-ui;color:#173d34}header{background:#173d34;color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{color:white}main{max-width:1100px;margin:auto;padding:24px 16px}section,article,dialog{background:white;border:1px solid #dce6dd;border-radius:16px;padding:20px;margin-bottom:14px}h1,h2,h3{margin:0 0 12px}button,input,select,textarea{font:inherit;border:1px solid #cbd9ce;border-radius:9px;padding:11px}button{background:#173d34;color:white;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:white;color:#173d34}button.danger{background:white;color:#a22}label{display:grid;gap:6px}form{display:grid;gap:12px}input,textarea,select{min-width:0;width:100%}dialog{width:min(500px,94vw);max-height:90dvh;overflow:auto}dialog::backdrop{background:#0008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tools select{flex:1;min-width:180px}.muted{color:#64786d}.tag{background:#e0efe5;border-radius:20px;padding:4px 9px;display:inline-block;font-size:12px}p{overflow-wrap:anywhere}#message{white-space:pre-wrap} [hidden]{display:none!important}</style></head><body><header><h1>kostora.</h1><div class="tools"><a href="./">Dashboard demo</a><button id="logout" class="secondary">Keluar</button></div></header><main><h2>Workspace Online</h2><p class="muted">Master data Supabase · v0.6. Tagihan online tersedia setelah migrasi SQL. Gunakan data uji hingga keamanan diverifikasi.</p><p id="message" role="status">Memeriksa sesi...</p><div id="workspace" hidden><section><div class="tools"><button data-tab="properties">Properti</button><button data-tab="rooms">Kamar</button><button data-tab="tenants">Penghuni</button><button data-tab="contracts">Kontrak</button><button id="billingTab">Tagihan</button></div></section><section><label>Properti aktif<select id="property"></select></label></section><div class="tools"><h2 id="title"></h2><button id="add">+ Tambah</button><button id="refresh" class="secondary">Refresh</button></div><div class="grid" id="list"></div><section id="billing" hidden></section></div></main><dialog id="dialog"><h2 id="formTitle"></h2><form id="form"></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), rupiah=x=>Number(x||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});
const db=window.supabase?.createClient('https://nqithmiifnclxhvomqfq.supabase.co','sb_publishable_o9oKcdo6cAs5zhcM4sBajQ_39OBCSKn');
let user, tab='properties', property='', records={}, busy=false;
const names={properties:'Properti',rooms:'Kamar',tenants:'Penghuni',contracts:'Kontrak sewa'}, tables={properties:'properties',rooms:'rooms',tenants:'tenants',contracts:'rental_contracts'};
const fields={properties:[['name','Nama properti','text',true],['address','Alamat','text'],['phone','WhatsApp','tel']],rooms:[['number','Nomor kamar','text',true],['type','Tipe kamar','text'],['rent','Harga sewa bulanan','number',true],['deposit','Deposit','number',true],['facilities','Fasilitas','text']],tenants:[['name','Nama penghuni','text',true],['phone','WhatsApp','tel'],['email','Email','email'],['address','Alamat','text'],['notes','Catatan','text']],contracts:[['start_date','Tanggal masuk','date',true],['end_date','Tanggal berakhir','date'],['first_due_date','Jatuh tempo pertama','date',true],['monthly_rent','Sewa bulanan','number',true],['deposit','Deposit','number',true]]};
function msg(s){$('message').textContent=s}
async function load(){if(busy)return;busy=true;$('workspace').hidden=true;msg('Memuat data online...');try{const results=await Promise.all(Object.entries(tables).map(async ([k,t])=>{const {data,error}=await db.from(t).select('*').eq('owner_id',user.id).limit(1000);if(error)throw error;return [k,data]}));records=Object.fromEntries(results);if(!records.properties.some(p=>p.id===property))property=records.properties[0]?.id||'';render();$('workspace').hidden=false;msg('Terhubung ke Supabase · Data online')}catch(e){msg('Gagal memuat database: '+e.message)}finally{busy=false}}
function render(){$('property').innerHTML=records.properties.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===property?'selected':'')+'>'+esc(p.name)+'</option>').join('')||'<option>Belum ada properti</option>';$('title').textContent=names[tab];$('add').textContent='+ Tambah '+names[tab];$('add').disabled=tab!=='properties'&&!property;const rows=records[tab].filter(r=>tab==='properties'||r.property_id===property);$('list').innerHTML=rows.map(r=>{let title=tab==='rooms'?'Kamar '+r.number:tab==='contracts'?(records.tenants.find(t=>t.id===r.tenant_id)?.name||'Penghuni'):r.name;let details=tab==='rooms'?rupiah(r.rent)+' / bulan · '+(records.contracts.some(c=>c.active&&c.room_id===r.id)?'Terisi':r.maintenance?'Maintenance':'Kosong'):tab==='contracts'?(records.rooms.find(x=>x.id===r.room_id)?.number||'-')+' · '+rupiah(r.monthly_rent)+' · '+(r.active?'Aktif':'Nonaktif'):r.address||'';return '<article><h3>'+esc(title)+'</h3><p>'+esc(details)+'</p><div class="tools"><button data-edit="'+esc(r.id)+'">Edit</button>'+(tab==='contracts'?(r.active?'<button class="danger" data-end="'+esc(r.id)+'">Nonaktifkan</button>':''):'<button class="danger" data-delete="'+esc(r.id)+'">Hapus</button>')+'</div></article>'}).join('')||'<p class="muted">Belum ada data. Klik Tambah untuk memulai.</p>'}
function openForm(r){if(tab!=='properties'&&!property){alert('Buat dan pilih properti terlebih dahulu.');return;}let kind=tab; $('formTitle').textContent=(r?'Edit ':'Tambah ')+names[kind];let h=fields[kind].map(([key,label,type,required])=>'<label>'+label+'<input name="'+key+'" type="'+type+'" value="'+esc(r?.[key]??(key==='deposit'?0:''))+'" '+(required?'required':'')+(type==='number'?' min="'+(key==='deposit'?0:1)+'" step="1"':'')+'></label>').join('');if(kind==='rooms')h+='<label>Status operasional<select name="maintenance"><option value="false">Tersedia</option><option value="true" '+(r?.maintenance?'selected':'')+'>Maintenance</option></select></label>';if(kind==='contracts'){const choices=records.rooms.filter(x=>x.property_id===property&&(!x.maintenance||x.id===r?.room_id)&&!records.contracts.some(c=>c.active&&c.room_id===x.id&&c.id!==r?.id));const people=records.tenants.filter(x=>x.property_id===property);if(!choices.length||!people.length){$('form').innerHTML='<p>Kontrak memerlukan kamar tersedia dan penghuni pada properti yang sama.</p>'+(!choices.length?'<p>Belum ada kamar kosong yang siap disewa.</p><button type="button" id="goRoom">Buka Master Kamar</button>':'')+(!people.length?'<p>Belum ada penghuni terdaftar.</p><button type="button" id="goTenant">Buka Master Penghuni</button>':'')+'<button type="button" id="cancel" class="secondary">Tutup</button>';$('dialog').showModal();$('cancel').onclick=()=>$('dialog').close();const go=t=>{$('dialog').close();tab=t;render()};if($('goRoom'))$('goRoom').onclick=()=>go('rooms');if($('goTenant'))$('goTenant').onclick=()=>go('tenants');return}const sel=(key,label,a,display)=>'<label>'+label+'<select name="'+key+'" required>'+a.map(x=>'<option value="'+esc(x.id)+'" '+(r?.[key]===x.id?'selected':'')+'>'+esc(display(x))+'</option>').join('')+'</select></label>';h=sel('room_id','Kamar',choices,x=>x.number)+sel('tenant_id','Penghuni',people,x=>x.name)+h}
$('form').innerHTML=h+'<button>Simpan online</button><button type="button" id="cancel" class="secondary">Batal</button>';$('dialog').showModal();$('cancel').onclick=()=>$('dialog').close();if(kind==='contracts'){const form=$('form'),el=n=>form.elements.namedItem(n);const applyRoom=()=>{const room=records.rooms.find(x=>x.id===el('room_id').value);if(room){el('monthly_rent').value=room.rent;el('deposit').value=room.deposit||0}};el('room_id').onchange=applyRoom;if(!r){applyRoom();const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Makassar'});el('start_date').value=today;el('first_due_date').value=today;}}$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const d=Object.fromEntries(new FormData(e.target));for(const [k,,type] of fields[kind]){if(type==='number')d[k]=Number(d[k]);else if(type==='date'&&!d[k])d[k]=null;else if(typeof d[k]==='string')d[k]=d[k].trim()}if(kind==='rooms'){d.maintenance=d.maintenance==='true';if(d.maintenance&&records.contracts.some(c=>c.active&&c.room_id===r?.id)){msg('Kamar masih terisi.');return}}if(kind==='contracts'&&(d.first_due_date<d.start_date||(d.end_date&&d.end_date<d.start_date))){alert('Periksa tanggal kontrak.');return}if(kind!=='properties')d.property_id=property;await write(async()=>r?db.from(tables[kind]).update(d).eq('id',r.id).eq('owner_id',user.id).select('id').single():db.from(tables[kind]).insert({...d,owner_id:user.id}).select('id').single(),true)}}
async function write(fn,close=false){if(busy)return;busy=true;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const {error}=await fn();if(error)throw error;if(close)$('dialog').close();busy=false;buttons.forEach(b=>b.disabled=false);await load()}catch(e){msg('Perubahan gagal: '+e.message);alert('Perubahan gagal: '+e.message)}finally{busy=false;buttons.forEach(b=>b.disabled=false);if(records.properties)$('add').disabled=tab!=='properties'&&!property}}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b||busy)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.edit)openForm(records[tab].find(r=>r.id===b.dataset.edit));if(b.dataset.delete&&confirm('Hapus data ini? Data yang memiliki relasi tidak dapat dihapus.'))await write(()=>db.from(tables[tab]).delete().eq('id',b.dataset.delete).eq('owner_id',user.id).select('id').single());if(b.dataset.end&&confirm('Nonaktifkan kontrak ini?'))await write(()=>db.from('rental_contracts').update({active:false}).eq('id',b.dataset.end).eq('owner_id',user.id).select('id').single())});
$('property').onchange=e=>{property=e.target.value;render()};$('add').onclick=()=>openForm();$('refresh').onclick=load;$('logout').onclick=async()=>{if(db){const {error}=await db.auth.signOut();if(error){msg(error.message);return}}location.replace('./')};

let billingMode=false;
const normalRender=render;
render=function(){normalRender();$('list').hidden=billingMode;$('add').hidden=billingMode;$('refresh').hidden=billingMode;$('billing').hidden=!billingMode;if(billingMode){$('title').textContent='Tagihan & pembayaran';loadBilling()}};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{billingMode=false}));
$('billingTab').onclick=()=>{billingMode=true;render()};
let billRows=[], paymentRows=[], billRequest=0;
const today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Makassar'});
const paidFor=i=>paymentRows.filter(p=>p.invoice_id===i.id).reduce((n,p)=>n+Number(p.amount),0);
const statusFor=i=>paidFor(i)>=Number(i.total)?'Lunas':i.due_date<today()?'Telat':paidFor(i)>0?'Dicicil':'Belum bayar';
const invoiceNo=i=>'INV-'+i.period_start.slice(0,7).replace('-','')+'-'+i.id.toUpperCase();
async function loadBilling(){const req=++billRequest,pid=property;const box=$('billing');box.textContent='Memuat tagihan...';if(!pid){box.textContent='Buat properti dahulu.';return}try{const [a,b]=await Promise.all([db.from('invoices').select('*').eq('property_id',pid).order('due_date',{ascending:false}),db.from('payments').select('*').eq('property_id',pid).order('paid_at',{ascending:false})]);if(a.error||b.error)throw a.error||b.error;if(req!==billRequest||!billingMode)return;billRows=a.data;paymentRows=b.data;drawBilling()}catch(e){if(req===billRequest)box.textContent='Gagal memuat tagihan: '+e.message}}
function drawBilling(){const total=billRows.reduce((n,i)=>n+Number(i.total),0),paid=billRows.reduce((n,i)=>n+paidFor(i),0);$('billing').innerHTML='<div class="grid"><article><small>Total tagihan</small><h2>'+rupiah(total)+'</h2></article><article><small>Diterima</small><h2>'+rupiah(paid)+'</h2></article><article><small>Sisa</small><h2>'+rupiah(total-paid)+'</h2></article></div><div class="tools"><button id="generate">Buat tagihan H-7</button><button id="billRefresh" class="secondary">Refresh</button></div><p class="muted">Pembuatan tagihan mencakup semua properti akun ini. Ringkasan menampilkan seluruh periode properti aktif.</p>'+billRows.map(i=>{const c=records.contracts.find(x=>x.id===i.contract_id),t=records.tenants.find(x=>x.id===c?.tenant_id),r=records.rooms.find(x=>x.id===c?.room_id);return '<article><small>'+esc(invoiceNo(i))+'</small><h3>'+esc(t?.name||'Penghuni')+' · Kamar '+esc(r?.number||'-')+'</h3><p>Jatuh tempo: '+esc(i.due_date)+' · <span class="tag">'+statusFor(i)+'</span></p><p>Total '+rupiah(i.total)+' · Sisa '+rupiah(Number(i.total)-paidFor(i))+'</p><button data-invoice="'+esc(i.id)+'">Detail & pembayaran</button></article>'}).join('');$('generate').onclick=async()=>{const b=$('generate');b.disabled=true;try{const {data,error}=await db.rpc('kostora_generate_invoices');if(error)throw error;msg(data+' tagihan baru dibuat.');await loadBilling()}catch(e){msg('Pembuatan gagal: '+e.message);alert('Jalankan migrasi SQL v0.6 terlebih dahulu jika fungsi belum tersedia. '+e.message)}finally{b.disabled=false}};$('billRefresh').onclick=loadBilling;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-invoice]');if(!b)return;const i=billRows.find(x=>x.id===b.dataset.invoice);if(!i)return;const c=records.contracts.find(x=>x.id===i.contract_id),t=records.tenants.find(x=>x.id===c?.tenant_id),r=records.rooms.find(x=>x.id===c?.room_id),left=Number(i.total)-paidFor(i);$('formTitle').textContent='Nota tagihan';$('form').innerHTML='<p>'+esc(invoiceNo(i))+'<br>'+esc(t?.name)+' · Kamar '+esc(r?.number)+'<br>Jatuh tempo '+esc(i.due_date)+'<br>Total '+rupiah(i.total)+'<br>Sisa '+rupiah(left)+'</p><h3>Riwayat pembayaran</h3>'+paymentRows.filter(p=>p.invoice_id===i.id).map(p=>'<p>'+esc(p.paid_at.slice(0,10))+' · '+rupiah(p.amount)+' · '+esc(p.method||'')+'</p>').join('')+(left>0?'<label>Nominal pembayaran<input name="amount" type="number" min="1" max="'+left+'" required></label><label>Metode<select name="method"><option>Transfer</option><option>Tunai</option></select></label><button>Catat pembayaran</button>':'<p>Lunas</p>')+'<button type="button" id="waBill">WhatsApp</button><button type="button" id="closeBill" class="secondary">Tutup</button>';$('dialog').showModal();$('closeBill').onclick=()=>$('dialog').close();$('waBill').onclick=()=>{let phone=String(t?.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'62');if(!/^62[0-9]{7,15}$/.test(phone)){alert('Lengkapi nomor WhatsApp penghuni.');return}window.open('https://wa.me/'+phone+'?text='+encodeURIComponent('Halo '+t.name+', tagihan kamar '+r?.number+' jatuh tempo '+i.due_date+'. Total '+rupiah(i.total)+', sisa '+rupiah(left)+'. Terima kasih.'),'_blank','noopener,noreferrer')};$('form').onsubmit=async ev=>{ev.preventDefault();if(left<=0)return;const btn=ev.target.querySelector('button[type="submit"],button:not([type])');if(btn.disabled)return;btn.disabled=true;const fd=new FormData(ev.target);try{const {error}=await db.from('payments').insert({owner_id:user.id,property_id:i.property_id,invoice_id:i.id,amount:Number(fd.get('amount')),method:fd.get('method')});if(error)throw error;$('dialog').close();await loadBilling()}catch(e){alert('Pembayaran gagal: '+e.message)}finally{btn.disabled=false}}});

(async()=>{try{if(!db)throw Error('Library gagal dimuat');const {data,error}=await db.auth.getUser();if(error||!data.user){location.replace('./');return}user=data.user;db.auth.onAuthStateChange((event,session)=>{if(!session||session.user.id!==user.id){$('workspace').hidden=true;$('list').innerHTML='';if($('dialog').open)$('dialog').close();location.replace('./')}});await load()}catch(e){msg(e.message)}})();
</script></body></html>
