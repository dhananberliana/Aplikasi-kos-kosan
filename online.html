 const boundary='kostora_'+crypto.randomUUID(),body=new Blob(['--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name,mimeType:'application/json'})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n',payload,'\r\n--'+boundary+'--\r\n'],{type:'multipart/related; boundary='+boundary});

 const result=await res.json();if(!res.ok){const e=Error(result.error?.message||'Google Drive gagal');e.status=res.status;e.reason=result.error?.errors?.[0]?.reason||result.error?.details?.find(x=>x.reason)?.reason||'';throw e}
 $('formTitle').textContent='Backup berhasil';$('form').innerHTML='<p>File JSON telah dibuat di Google Drive. Simpan secara pribadi.</p><p>'+esc(result.name)+'</p><p>'+Object.entries(data).map(([k,v])=>esc(k)+': '+v.length).join('<br>')+'</p><a id="backupOpen" target="_blank" rel="noopener noreferrer">Buka file di Google Drive</a><button type="button" id="backupClose">Tutup</button>';
 $('backupOpen').href='https://drive.google.com/open?id='+encodeURIComponent(result.id);$('backupClose').onclick=()=>$('dialog').close();$('dialog').showModal();
 }catch(e){if(e.status===401||/insufficientPermissions|ACCESS_TOKEN_SCOPE_INSUFFICIENT|authError/i.test(e.reason||'')||/insufficient authentication scopes/i.test(e.message)){if(confirm('Google Drive HTTP '+e.status+' — '+(e.reason||'')+'\n'+e.message+'\n\nHubungkan ulang akun Google admin yang sama?'))try{await authorizeSheets('backup')}catch(err){alert(err.message)}}else alert('Backup gagal'+(e.status?' (HTTP '+e.status+')':'')+(e.reason?' ['+e.reason+']':'')+': '+e.message)}finally{b.disabled=false}
}
