function edit(t){if(t?.archived){alert('Penghuni nonaktif hanya dapat dilihat melalui nota.');return}const available=localRooms().filter(r=>!r.maintenance&&(!occupant(r)||occupant(r).id===t?.id));if(!available.length){alert('Tidak ada kamar tersedia. Tambahkan kamar terlebih dahulu.');return}openForm(t?'Edit penghuni':'Penghuni baru',field('Nama lengkap (demo)','name',t?.name,'text','required')+field('Nomor WhatsApp (demo)','phone',t?.phone,'tel','pattern="[0-9]*"')+field('Email (demo)','email',t?.email,'email')+field('Alamat sesuai KTP (demo)','address',t?.address)+field('Tanggal masuk','start',t?.start,'date')+'<label>Kamar<select name="roomId" required>'+available.map(r=>'<option value="'+esc(r.id)+'" '+(r.id===t?.roomId?'selected':'')+'>'+esc(r.number)+' · '+money(r.rent)+'</option>').join('')+'</select></label>'+field('Sewa bulanan','rent',t?.rent||available[0].rent,'number','required min="'+Math.max(1,t?.paid||0)+'" step="1"')+field('Deposit','deposit',t?.deposit||0,'number','required min="0" step="1"')+field('Jatuh tempo','due',t?.due,'date','required')+field('Durasi sewa (bulan)','duration',t?.duration||1,'number','min="1" required')+field('Catatan','notes',t?.notes),d=>{let r=available.find(r=>r.id===d.roomId);if(!r||!d.name.trim()||(d.start&&d.start>d.due)){alert('Periksa nama, kamar dan tanggal sewa.');return false}const v={...d,room:r.number,property,rent:Number(d.rent),deposit:Number(d.deposit),duration:Number(d.duration)};if(t)Object.assign(t,v);else state.tenants.push({...v,id:Date.now(),paid:0,archived:false})});if(!t){$('masterForm').roomId.onchange=e=>{const r=available.find(r=>r.id===e.target.value);$('masterForm').rent.value=r.rent;$('masterForm').deposit.value=r.deposit};$('masterForm').deposit.value=available[0].deposit}}
function detail(t){$('modal').innerHTML='<h2>Nota sewa</h2><p>'+esc(t.name)+' · Kamar '+esc(t.room)+'</p><p>Alamat: '+esc(t.address||'-')+'<br>Tanggal masuk: '+esc(t.start||'-')+'</p><p>Total: '+money(t.rent)+'<br>Dibayar: '+money(t.paid)+'<br>Sisa: '+money(t.rent-t.paid)+'<br>Status: '+status(t)+'</p><form id="pay"><label>Tambah pembayaran<input name="amount" type="number" min="1" max="'+(t.rent-t.paid)+'" required></label><button '+(t.paid>=t.rent?'disabled':'')+'>Catat pembayaran</button></form><div class="actions"><button id="wa">WhatsApp</button><button id="edit">Edit</button><button id="archive" class="danger" '+(t.archived?'disabled':'')+'>Nonaktifkan</button><button data-close>Tutup</button></div>';$('modal').showModal();$('pay').onsubmit=e=>{e.preventDefault();let a=Number(new FormData(e.target).get('amount'));if(a>0&&a<=t.rent-t.paid){t.paid+=a;save();$('modal').close();render()}};$('archive').onclick=()=>{if(confirm('Nonaktifkan penghuni? Riwayat tagihan tetap disimpan dan kamar akan tersedia.')){t.archived=true;save();$('modal').close();render()}};$('edit').onclick=()=>{$('modal').close();edit(t)};$('wa').onclick=()=>{if(!/^62\d{7,15}$/.test(t.phone)){alert('Isi nomor WhatsApp dahulu.');return}window.open('https://wa.me/'+t.phone+'?text='+encodeURIComponent('Halo '+t.name+', tagihan kamar '+t.room+' jatuh tempo '+t.due+'. Sisa '+money(t.rent-t.paid)), '_blank','noopener,noreferrer')}}
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('tenantRows').innerHTML=rows()}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;filter='Semua';search='';render()}if(b.dataset.detail)detail(state.tenants.find(t=>t.id===Number(b.dataset.detail)));if(b.dataset.useProperty){property=b.dataset.useProperty;page='Dashboard';render()}if(b.dataset.editProperty)editProperty(state.properties.find(p=>p.id===b.dataset.editProperty));if(b.dataset.editRoom)editRoom(state.rooms.find(r=>r.id===b.dataset.editRoom));if(b.dataset.deleteRoom){let r=state.rooms.find(r=>r.id===b.dataset.deleteRoom);if(state.tenants.some(t=>t.roomId===r.id)){alert('Kamar memiliki riwayat penghuni dan tidak dapat dihapus.')}else if(confirm('Hapus kamar?')){state.rooms=state.rooms.filter(x=>x.id!==r.id);save();render()}}if(b.dataset.deleteProperty){let id=b.dataset.deleteProperty;if(state.properties.length===1||[...state.rooms,...state.tenants,...state.expenses,...state.complaints].some(x=>x.property===id)){alert('Properti terakhir atau memiliki data terkait tidak dapat dihapus.')}else if(confirm('Hapus properti?')){state.properties=state.properties.filter(p=>p.id!==id);if(property===id)property=state.properties[0].id;save();render()}}if(b.hasAttribute('data-close'))$('modal').close()});$('add').onclick=()=>page==='Properti'?editProperty():page==='Kamar'?editRoom():edit();$('propertySelect').onchange=e=>{property=e.target.value;filter='Semua';search='';render()};document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;$('tenantRows').innerHTML=rows()}if(e.target.dataset.complaint!==undefined){state.complaints[e.target.dataset.complaint].status=e.target.value;save()}});document.addEventListener('submit',e=>{if(!['expense','complaint'].includes(e.target.id))return;e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(e.target.id==='expense')state.expenses.push({...f,property,amount:Number(f.amount)});else state.complaints.push({...f,property,status:'Baru'});save();render()});render();
</script></html>
