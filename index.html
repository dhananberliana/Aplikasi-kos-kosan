<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kostora | Manajemen Kos</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#172d25;font:15px system-ui,sans-serif}aside{position:fixed;width:220px;inset:0 auto 0 0;background:#173d34;color:white;padding:24px}aside h1{font-size:30px;margin:0 0 40px}button,select,input{font:inherit;padding:10px 12px;border:1px solid #d5ded7;border-radius:9px}button{cursor:pointer;background:#173d34;color:white}nav button{display:block;width:100%;text-align:left;border:0;margin:6px 0;background:transparent}nav button:hover,nav button.active{background:#ffffff22}main{margin-left:220px;padding:30px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1,h2,p{margin-top:0}.muted,small{color:#66786e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,section{background:white;border:1px solid #e1e7df;border-radius:16px;padding:20px;margin-bottom:16px}.hero{background:#173d34;color:white}.hero small{color:#cbe1d1}.amount{font-size:clamp(19px,3vw,30px);font-weight:700;margin:12px 0}.track{background:#dae5db;height:9px;border-radius:20px;overflow:hidden}.fill{background:#79b99a;height:100%}.line{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #edf0eb}.line>div:first-child{flex:1}.tag{padding:5px 9px;border-radius:20px;font-size:12px;background:#eef0ed}.Lunas{background:#d9f1df;color:#21623c}.Telat{background:#fce0df;color:#a32828}.Dicicil{background:#fff0c5;color:#886000}form{display:grid;gap:10px;max-width:550px}label{display:grid;gap:5px}dialog{border:0;border-radius:16px;width:min(460px,94vw);padding:24px}dialog::backdrop{background:#0008}.actions{display:flex;gap:8px;flex-wrap:wrap}.bars{display:flex;align-items:flex-end;gap:12px;height:150px}.bar{flex:1;background:#8db9a4;border-radius:7px 7px 0 0;min-height:3px}.room{min-height:100px}.notice{font-size:12px;color:#66786e} @media(max-width:760px){aside{inset:auto 0 0;width:100%;padding:6px;z-index:5}aside h1{display:none}nav{display:flex;overflow:auto}nav button{font-size:11px;text-align:center;white-space:nowrap;padding:12px 8px}main{margin:0;padding:16px 14px 90px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card,section{padding:14px}.line{flex-wrap:wrap}header h1{font-size:23px}}
</style><aside><h1>kostora.</h1><nav id="nav"></nav></aside><main><header><div><small>KOSTORA / DEMO</small><h1 id="heading"></h1></div><button id="add">+ Penghuni</button></header><p class="notice">Mode demo lokal • Jangan masukkan data pribadi asli.</p><div id="view"></div></main><dialog id="modal"></dialog><script>
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={tenants:[{id:1,name:'Andi (Demo)',room:'01',rent:1500000,paid:1500000,due:'2026-12-10',phone:''},{id:2,name:'Dewi (Demo)',room:'02',rent:1500000,paid:750000,due:'2026-12-10',phone:''},{id:3,name:'Rizky (Demo)',room:'03',rent:1500000,paid:0,due:'2026-11-10',phone:''}],expenses:[],complaints:[]};let state;try{state=JSON.parse(localStorage.getItem('kostora-demo-v1'))||seed}catch{state=seed}let page='Dashboard',filter='Semua';const save=()=>localStorage.setItem('kostora-demo-v1',JSON.stringify(state));const status=t=>t.paid>=t.rent?'Lunas':t.due<new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Makassar'})?'Telat':t.paid>0?'Dicicil':'Belum bayar';const sum=(a,k)=>a.reduce((s,t)=>s+Number(t[k]),0);const menus=['Dashboard','Kamar','Penghuni','Tagihan','Keluhan','Laporan'];function list(){return '<select id="filter">'+['Semua','Lunas','Telat','Dicicil','Belum bayar'].map(s=>'<option '+(s===filter?'selected':'')+'>'+s+'</option>').join('')+'</select>'+state.tenants.filter(t=>filter==='Semua'||status(t)===filter).map(t=>'<div class="line"><div><b>'+esc(t.name)+'</b><br><small>Kamar '+esc(t.room)+' · '+esc(t.due)+'</small></div><span class="tag '+status(t)+'">'+status(t)+'</span><b>'+money(t.rent-t.paid)+'</b><button data-detail="'+t.id+'">Nota</button></div>').join('')}
function render(){ $('heading').textContent=page;$('nav').innerHTML=menus.map(m=>'<button class="'+(m===page?'active':'')+'" data-page="'+m+'">'+m+'</button>').join('');const total=sum(state.tenants,'rent'),paid=sum(state.tenants,'paid'),expense=sum(state.expenses,'amount'),late=state.tenants.filter(t=>status(t)==='Telat').reduce((s,t)=>s+t.rent-t.paid,0),pct=total?Math.round(paid/total*100):0;const card=(title,value)=>'<div class="card"><small>'+title+'</small><div class="amount">'+value+'</div></div>';let html='';if(page==='Dashboard'){html='<section class="hero"><small>Pembayaran diterima · Siklus demo</small><div class="amount">'+money(paid)+'</div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><p>'+pct+'% dari '+money(total)+'</p></section><div class="grid">'+card('Belum diterima',money(total-paid))+card('Telat bayar',money(late))+card('Kamar terisi',state.tenants.length+' / 10')+card('Kas bersih',money(paid-expense))+'</div><section><h2>Daftar penghuni</h2>'+list()+'</section>'}if(page==='Penghuni'||page==='Tagihan')html='<section><h2>'+page+'</h2>'+list()+'</section>';if(page==='Kamar')html='<div class="grid">'+Array.from({length:10},(_,i)=>{let n=String(i+1).padStart(2,'0'),t=state.tenants.find(t=>t.room===n);return '<div class="card room"><h2>Kamar '+n+'</h2><span class="tag '+(t?'Lunas':'')+'">'+(t?esc(t.name):'Kosong')+'</span></div>'}).join('')+'</div>';if(page==='Laporan')html='<div class="grid">'+card('Pemasukan',money(paid))+card('Pengeluaran',money(expense))+card('Kas bersih',money(paid-expense))+'</div><section><h2>Pengeluaran</h2><form id="expense"><input name="title" required placeholder="Nama pengeluaran"><input name="amount" required type="number" min="1" placeholder="Nominal"><button>Tambah pengeluaran</button></form>'+state.expenses.map(e=>'<div class="line"><div>'+esc(e.title)+'</div>'+money(e.amount)+'</div>').join('')+'</section>';if(page==='Keluhan')html='<section><h2>Keluhan penghuni</h2><form id="complaint"><select name="tenant" required>'+state.tenants.map(t=>'<option>'+esc(t.name)+'</option>').join('')+'</select><input name="title" required placeholder="Deskripsi kerusakan"><button>Tambah keluhan</button></form>'+state.complaints.map((c,i)=>'<div class="line"><div>'+esc(c.title)+'<br><small>'+esc(c.tenant)+'</small></div><select data-complaint="'+i+'">'+['Baru','Diproses','Selesai'].map(s=>'<option '+(s===c.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join('')+'</section>';$('view').innerHTML=html}
function edit(t){$('modal').innerHTML='<h2>'+(t?'Edit penghuni':'Penghuni baru')+'</h2><form id="tenant"><label>Nama<input name="name" required value="'+esc(t?.name)+'"></label><label>Kamar<select name="room">'+Array.from({length:10},(_,i)=>String(i+1).padStart(2,'0')).filter(n=>!state.tenants.some(x=>x.room===n&&x.id!==t?.id)).map(n=>'<option '+(n===t?.room?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Sewa bulanan<input name="rent" type="number" min="'+(t?.paid||1)+'" required value="'+(t?.rent||1500000)+'"></label><label>Jatuh tempo<input name="due" type="date" required value="'+esc(t?.due||'')+'"></label><label>Nomor WhatsApp (62...)<input name="phone" pattern="[0-9]*" value="'+esc(t?.phone)+'"></label><button>Simpan</button><button type="button" data-close>Batal</button></form>';$('modal').showModal();$('tenant').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!f.room)return;Object.assign(t||{},f);if(t)t.rent=Number(f.rent);else state.tenants.push({...f,id:Date.now(),rent:Number(f.rent),paid:0});save();$('modal').close();render()}}
function detail(t){$('modal').innerHTML='<h2>Nota sewa</h2><p>'+esc(t.name)+' · Kamar '+esc(t.room)+'</p><p>Total: '+money(t.rent)+'<br>Dibayar: '+money(t.paid)+'<br>Sisa: '+money(t.rent-t.paid)+'<br>Status: '+status(t)+'</p><form id="pay"><label>Tambah pembayaran<input name="amount" type="number" min="1" max="'+(t.rent-t.paid)+'" required></label><button '+(t.paid>=t.rent?'disabled':'')+'>Catat pembayaran</button></form><div class="actions"><button id="wa">WhatsApp</button><button id="edit">Edit</button><button data-close>Tutup</button></div>';$('modal').showModal();$('pay').onsubmit=e=>{e.preventDefault();let a=Number(new FormData(e.target).get('amount'));if(a>0&&a<=t.rent-t.paid){t.paid+=a;save();$('modal').close();render()}};$('edit').onclick=()=>{$('modal').close();edit(t)};$('wa').onclick=()=>{if(!/^62\d{7,15}$/.test(t.phone)){alert('Isi nomor WhatsApp dahulu.');return}window.open('https://wa.me/'+t.phone+'?text='+encodeURIComponent('Halo '+t.name+', tagihan kamar '+t.room+' jatuh tempo '+t.due+'. Sisa '+money(t.rent-t.paid)), '_blank','noopener,noreferrer')}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.detail)detail(state.tenants.find(t=>t.id===Number(b.dataset.detail)));if(b.hasAttribute('data-close'))$('modal').close()});$('add').onclick=()=>edit();document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.dataset.complaint!==undefined){state.complaints[e.target.dataset.complaint].status=e.target.value;save()}});document.addEventListener('submit',e=>{if(!['expense','complaint'].includes(e.target.id))return;e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(e.target.id==='expense')state.expenses.push({...f,amount:Number(f.amount)});else state.complaints.push({...f,status:'Baru'});save();render()});render();
</script></html>
