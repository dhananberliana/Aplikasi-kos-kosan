<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Kostora | Portal Penghuni</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f3;color:#173d34;font:15px system-ui}main{max-width:680px;margin:auto;padding:20px}section{background:white;padding:20px;border:1px solid #dce6dd;border-radius:16px;margin:12px 0}h1{font-size:34px;letter-spacing:-2px}h2{font-size:19px}label{display:grid;gap:6px;margin:12px 0}input,textarea,button{font:inherit;padding:12px;border:1px solid #cbd9ce;border-radius:8px;width:100%}button{background:#173d34;color:white;cursor:pointer}button:disabled{opacity:.5}small{color:#64786d}p{overflow-wrap:anywhere}.hero{background:#173d34;color:white}.hero small{color:#cfe3d5}details{border-top:1px solid #ddd;padding:10px 0}summary{cursor:pointer}[hidden]{display:none!important}@media print{form,button{display:none}}</style><main><h1>kostora.</h1><small>RESIDENT PORTAL</small><p id="message" role="status">Memuat...</p><div id="content" hidden><section class="hero" id="welcome"></section><section id="bills"></section><section><h2>Lapor kerusakan</h2><form id="complaint"><label>Judul<input name="title" required maxlength="120"></label><label>Deskripsi<textarea name="description" required maxlength="2000" rows="4"></textarea></label><label>Foto opsional (JPEG, PNG, WebP; maks. 2 MB)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><button>Kirim laporan</button></form></section><section id="history"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rp=x=>Number(x||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}),token=location.hash.slice(1),db=window.supabase?.createClient('https://nqithmiifnclxhvomqfq.supabase.co','sb_publishable_o9oKcdo6cAs5zhcM4sBajQ_39OBCSKn',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
async function load(){try{if(!db||!/^[0-9a-f-]{36}$/i.test(token))throw Error();const {data:d,error}=await db.rpc('kostora_portal_read',{p_token:token});if(error||!d)throw Error();$('welcome').innerHTML='<h2>Halo, '+esc(d.tenant)+'</h2><p>'+esc(d.property)+' · Kamar '+esc(d.room)+'</p><small>Total sisa tagihan</small><h2>'+rp(d.invoices.reduce((n,i)=>n+Math.max(0,i.total-i.paid),0))+'</h2>';$('bills').innerHTML='<h2>Tagihan saya</h2>'+d.invoices.map(i=>{const s=Math.max(0,i.total-i.paid),status=s===0?'Lunas':i.due<new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Makassar'})?'Telat':i.paid?'Dicicil':'Belum bayar';return '<details><summary>'+esc(i.period)+' · '+status+' · '+rp(s)+'</summary><p>Jatuh tempo '+esc(i.due)+'<br>Total '+rp(i.total)+'<br>Dibayar '+rp(i.paid)+'<br>Sisa '+rp(s)+'</p>'+i.payments.map(p=>'<p>'+esc(p.date.slice(0,10))+' · '+rp(p.amount)+' · '+esc(p.method)+'</p>').join('')+'</details>'}).join('')+(!d.invoices.length?'<p>Belum ada tagihan.</p>':'');$('history').innerHTML='<h2>Riwayat keluhan</h2>'+d.complaints.map(q=>'<p><b>'+esc(q.title)+'</b> · '+esc(q.status)+'<br>'+esc(q.description)+'</p>').join('')+(!d.complaints.length?'<p>Belum ada keluhan.</p>':'');$('content').hidden=false;$('message').textContent='Link pribadi · Jangan bagikan kepada orang lain.'}catch(e){$('content').hidden=true;$('message').textContent='Link tidak berlaku atau koneksi gagal. Hubungi pemilik kos.'}}
$('complaint').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const f=new FormData(e.target),file=f.get('photo');let photo=null;if(file?.size){if(file.size>2000000||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Foto maksimal 2 MB dan harus JPEG, PNG atau WebP.');photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}const {error}=await db.rpc('kostora_portal_complain',{p_token:token,p_title:f.get('title'),p_description:f.get('description'),p_photo:photo});if(error)throw error;e.target.reset();await load();alert('Laporan berhasil dikirim.')}catch(e){alert(e.message||'Gagal mengirim laporan.')}finally{b.disabled=false}};load();
</script></html>
